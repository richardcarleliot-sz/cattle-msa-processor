[metadata]
name = cattle-msa-processor
version = 0.1.0
author = richardcarleliot-sz
author_email = richardcarleliot@gmail.com
description = A high-performance toolkit for processing multi-species alignment (MAF) data for genome modeling.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/richardcarleliot-sz/cattle-msa-processor
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]

package_dir = = cattle_msa_processor

packages = find:

python_requires = >=3.7

install_requires =
    numpy>=1.20.0
    zarr>=2.10.0
    pandas>=1.3.0
    pyarrow>=5.0.0
    biopython>=1.79
    tqdm>=4.62.0


[options.entry_points]
console_scripts =
    cattle-msa-processor = cattle_msa_processor.cli:main


[options.extras_require]

dev =
    black
    flake8
    mypy

test =
    pytest>=6.0
    pytest-cov

[options.package_data]
* = *.txt, *.json, *.yaml

[options.exclude_package_data]
* = *.pyc
* = __pycache__

[bdist_wheel]
universal = 1